name: Full Stack CI

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Backend Tests
      working-directory: backend
      run: |
        npm install
        npm test

    - name: Frontend Tests
      working-directory: frontend
      run: |
        npm install
        npm test -- --watchAll=false